<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASTRA — Space Medical Emergency Assistant (prototype)</title>
<style>
:root{--bg:#0a101c;--panel:#111a2b;--panel2:#17233a;--line:#24324d;--text:#e7edf6;--mute:#8ea0bb;--crit:#ff4d4f;--over:#c62828;--warn:#f5a524;--ok:#2ecc71;--acc:#4da3ff;--phase:#9b7bff;--std:#4da3ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:600;min-height:48px}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#04111f}
.btn.red{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.dred{background:var(--over);border-color:var(--over);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:7px 11px;font-size:14px;border-radius:9px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.muted{color:var(--mute)}
.small{font-size:13px}
/* header */
#hdr{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;background:#070c16;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-weight:900;letter-spacing:2px;font-size:20px;margin-right:4px}
.brand small{display:block;font-size:10px;letter-spacing:.5px;font-weight:600;color:var(--mute)}
#hdr select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px;font:inherit;font-weight:600;min-height:40px}
.sp{flex:1}
.link-OK{color:var(--ok)}.link-DELAYED{color:var(--warn)}.link-LOST{color:var(--crit)}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block}
/* vitals */
#vitals{display:flex;gap:8px;overflow-x:auto;padding:8px 14px;background:#0c1424;border-bottom:1px solid var(--line)}
.v{min-width:76px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 9px;flex:0 0 auto}
.v .l{font-size:11px;color:var(--mute);font-weight:700}
.v .n{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.v .u{font-size:10px;color:var(--mute);margin-left:2px}
.v.warn{border-color:var(--warn)}.v.warn .n{color:var(--warn)}
.v.crit{border-color:var(--crit);background:#2a0f14}.v.crit .n{color:var(--crit)}
.v.stale{opacity:.45}
.v.env{background:#0f1a24}
.vsrc{align-self:center;font-size:11px;color:var(--mute);white-space:nowrap;padding-left:4px}
/* banners */
.ban{margin:10px 14px 0;border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700}
.ban.alarm{background:var(--over);animation:pulse 1.2s infinite}
.ban.mcc{background:#123059;border:1px solid var(--acc)}
@keyframes pulse{50%{filter:brightness(1.25)}}
/* layout */
#body{display:grid;grid-template-columns:1fr;gap:0}
#body.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
#main{padding:14px;max-width:920px;width:100%;margin:0 auto;padding-bottom:140px}
#groundPane{border-left:1px solid var(--line);background:#081120;min-height:calc(100vh - 120px)}
@media(max-width:1000px){#body.split{grid-template-columns:1fr}#body.split #main{display:none}#groundPane{border-left:0}}
h1{font-size:26px;margin:6px 0 4px}h2{font-size:19px;margin:16px 0 8px}h3{font-size:16px;margin:12px 0 6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.quick .btn{min-height:74px;font-size:16px;text-align:left;line-height:1.2}
.quick .btn b{display:block;font-size:18px}
textarea{width:100%;min-height:96px;background:#0b1322;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:17px;resize:vertical}
input[type=text]{background:#0b1322;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;min-height:44px}
.demos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.demos button{background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;font-size:13px;text-align:left;color:var(--mute)}
.interim{color:var(--warn);font-style:italic;min-height:20px;margin-top:6px}
/* question */
.qtext{font-size:30px;font-weight:800;line-height:1.2;margin:14px 0 20px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yn .btn{min-height:96px;font-size:28px;font-weight:900}
.yes{background:#11402a!important;border-color:var(--ok)!important}
.no{background:#40141a!important;border-color:var(--crit)!important}
.unsure{grid-column:1/-1;min-height:60px!important;font-size:18px!important}
.bar{height:8px;background:#0b1322;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .4s}
.mini{display:grid;grid-template-columns:1fr 52px;gap:4px 10px;align-items:center;font-size:13px}
/* matches */
.m{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--crit);border-radius:14px;padding:12px;margin:10px 0}
.m.watch{border-left-color:var(--warn)}.m.crit{border-left-color:var(--crit)}.m.over{border-left-color:var(--crit)}.m.phase{border-left-color:var(--phase)}
.m .rk{font-size:22px;font-weight:900;color:var(--mute);text-align:center}
.m .pc{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}
.m .nm{font-weight:800;font-size:17px}
.m .why{font-size:12px;color:var(--mute);margin-top:4px}
.m .go{grid-column:1/-1}
.pin{border:2px solid var(--crit);background:#2a0f14;border-radius:14px;padding:12px;margin:10px 0}
/* checklist */
.ck-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.steps{list-style:none;padding:0;margin:10px 0}
.st{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--panel)}
.st .bx{width:36px;height:36px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;font-weight:900}
.st.done{opacity:.55}.st.done .bx{background:var(--ok);border-color:var(--ok);color:#04111f}
.st.cur{border:2px solid var(--acc);background:#0f2140}
.st.cur .tx{font-size:20px}
.st .tx{font-weight:700;font-size:16px;line-height:1.3}
.st .dt{font-size:13px;color:var(--mute);margin-top:3px}
.st.crit .tx::before{content:"⚠ ";color:var(--crit)}
.vchip{display:inline-block;margin:5px 5px 0 0;font-size:12px;padding:2px 8px;border-radius:7px;background:#0b1322;border:1px solid var(--line);font-weight:700}
.vchip.crit{color:var(--crit);border-color:var(--crit)}.vchip.warn{color:var(--warn);border-color:var(--warn)}
.prog{height:10px}
/* bottom bar */
#bar{position:fixed;left:0;right:0;bottom:0;background:#070c16ee;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:12px;z-index:25}
.mic{width:68px;height:68px;border-radius:50%;background:var(--acc);color:#04111f;font-size:30px;flex:0 0 auto;display:grid;place-items:center;box-shadow:0 0 0 0 rgba(77,163,255,.6)}
.mic.on{background:var(--crit);color:#fff;animation:ring 1.3s infinite}
.mic.off{background:var(--panel2);color:var(--mute)}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,77,79,.6)}100%{box-shadow:0 0 0 18px rgba(255,77,79,0)}}
.barmsg{flex:1;min-width:0;font-size:14px}
.barmsg b{display:block;font-size:15px}
.tog{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);white-space:nowrap}
.sw{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative}
.sw::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s}
.sw.on{background:var(--ok)}.sw.on::after{left:21px}
/* modal */
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal.show{display:flex}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:640px;width:100%;max-height:90vh;overflow:auto}
.dlg.alert{border:3px solid var(--crit)}
pre.sit{white-space:pre-wrap;background:#0b1322;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;line-height:1.45;max-height:42vh;overflow:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:9px 12px;font-weight:700;font-size:13px}
.seg button.on{background:var(--acc);color:#04111f}
/* dev */
#dev{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#070c16;border-left:1px solid var(--line);z-index:40;overflow:auto;padding:14px;transform:translateX(100%);transition:transform .25s}
#dev.show{transform:none}
.mlog{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#0b1322;border:1px solid var(--line);border-radius:8px;padding:8px;max-height:240px;overflow:auto}
.mlog div{padding:2px 0;border-bottom:1px solid #16213a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.in{color:#7fd6a5}.out{color:#8fc3ff}
/* ground */
.g{padding:14px;max-width:1100px;margin:0 auto}
.ghdr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.ghdr h1{font-size:20px;margin:0;letter-spacing:1px}
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:1100px){.ggrid{grid-template-columns:1fr}}
#body.split .ggrid{grid-template-columns:1fr}
.rep{border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:10px;padding:10px;margin:8px 0;background:var(--panel2)}
.rep.EMERGENCY{border-left-color:var(--crit)}.rep.URGENT{border-left-color:var(--warn)}
.rep.new{animation:pulse 1s 6}
.gst{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:7px 8px;border-radius:8px;font-size:14px;align-items:start}
.gst.done{color:var(--mute)}.gst.cur{background:#0f2140;border:1px solid var(--acc);font-weight:700}
.age{font-variant-numeric:tabular-nums}
.foot{font-size:11px;color:var(--mute);text-align:center;margin:24px 0 0}
.hide{display:none!important}
.acts{position:sticky;bottom:92px;background:var(--bg);padding:8px 0;z-index:5}
@media(max-width:600px){.brand small,.hl{display:none}#hdr{gap:6px;padding:8px 10px}.qtext{font-size:26px}}

/* ---- v0.3: Med C/L-aligned checklist elements ---- */
.acts{position:sticky;bottom:92px;background:var(--bg);padding:8px 0;z-index:5}
@media(max-width:600px){.brand small,.hl{display:none}#hdr{gap:6px;padding:8px 10px}.qtext{font-size:26px}}
.info{list-style:none;border-radius:12px;padding:10px 12px;margin:8px 0;border:1px solid var(--line)}
.info.warning{background:#2a1013;border-color:#7a2a30}
.info.note{background:#111c2e;border-style:dashed}
.info .ik{font-size:11px;font-weight:900;letter-spacing:1px;color:var(--mute)}
.info.warning .ik{color:var(--crit)}
.info .tx{font-weight:700;margin-top:2px}
.iff{color:var(--warn);font-weight:800}
.meta{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.ref{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:#0b1322;border:1px solid var(--line);color:var(--mute)}
.ref.astra{color:var(--phase);border-color:#4c3b80}
.ref.star{color:var(--warn);border-color:#6b4d12}
.st.na .tx{text-decoration:line-through}
.items{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.dt.rec{color:var(--acc);font-weight:700}
details.srcs{margin:8px 0;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
details.srcs summary{cursor:pointer;font-weight:700}
.gst.ginfo{color:var(--warn);font-style:italic}
.sel{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px}

</style>
</head>
<body>
<header id="hdr"></header>
<div id="vitals" aria-label="Live vitals"></div>
<div id="banner" role="status" aria-live="polite"></div>
<div id="body">
  <main id="main"></main>
  <section id="groundPane" class="hide" aria-label="Health Command ground console"></section>
</div>
<footer id="bar"></footer>
<div id="modal" role="dialog" aria-modal="true"></div>
<aside id="dev" aria-label="Integration panel"></aside>

ue":5,swelling:1.5,itch:2,anaphyla:6,epipen:5,reaction:2,"new medication":1.5,rash:1},sources:[{section:"Allergic Reaction \u2014 Severe Reaction",page:"1-29"},{section:"Allergic Reaction \u2014 Mild-to-Moderate Reaction",page:"2-3"},{section:"Shock",page:"1-44"}],steps:[{kind:"warning",text:"Can follow exposure to any substance, even one never reacted to before. Shock possible \u2192 Shock checklist",goto:4,ref:"1-29"},{text:"Supplemental O\u2082 (QDM)",vitals:["spo2"],ref:"1-29"},{kind:"unstow",text:"Unstow",items:["Blood Pressure Cuff (IV Admin-1)","Stethoscope (Airway Subpack-12)","Epi Pen Injector (Drug Subpack-9)"],ref:"1-29"},{text:"Epi Pen \u2014 black tip to outer thigh, press firmly, hold 10 s",detail:"Not through clothing; thumb off the end. Restow used pen in yellow vial marked \u201CUSED\u201D.",ref:"1-29",critical:!0},{kind:"record",text:"Monitor pulse, respiration, blood pressure",vitals:["hr","rr","sbp","spo2"],ref:"1-29"},{use:"contact"},{if:"No improvement in breathing or BP 5 min after first injection",text:"Epinephrine 0.3\u20130.5 mL subcutaneously via Tubex injector",detail:"Injectable Epinephrine, Drug Subpack-5",vitals:["sbp","hr"],surgeon:!0,ref:"1-29",critical:!0},{text:"Benadryl (injectable) 1 ampule IM",detail:"Drug Subpack-13",surgeon:!0,ref:"1-29"},{text:"Dexamethasone 1 mL (10 mg/mL) IM",detail:"Drug Subpack-28",surgeon:!0,ref:"1-29"},{if:"BP and pulse stable but wheezing persists",text:"Proventil inhaler 2 puffs; may repeat in 1 h, then 2 puffs every 4 h",surgeon:!0,ref:"1-29"},{text:"IV access; 1 L normal saline if BP low",vitals:["sbp"],ref:"1-44"},{use:"ivgravity"}]},{id:4,name:"Shock, Bleeding & Major Trauma",tier:"crit",prior:0,keywords:{bleed:4,blood:3,haemorrhage:5,hemorrhage:5,crush:5,pinned:4,trapped:3,hatch:2,trauma:3,"pale and sweaty":3,clammy:3,shock:2,"vomiting blood":5,"black stool":4,cargo:2,impact:2},sources:[{section:"Shock",page:"1-44"},{section:"Abdominal Injury",page:"1-27"},{section:"Chest Injury",page:"1-35"},{section:"Injections \u2014 Intravenous (I.V.)",page:"4-11"}],steps:[{kind:"note",text:"Most critical step is identifying and treating the cause \u2014 heart damage, blood/fluid loss (bleeding, burns, dehydration), or pooling (allergy, pain, drugs, heat stroke, infection)",ref:"1-44"},{use:"abc"},{text:"Rescuer safety; secure loose objects; contain blood droplets",detail:"Absorbent pads; eye protection for all crew.",critical:!0},{if:"Bleeding",text:"Apply pressure with Gauze Pads (Trauma Subpack-14)",detail:"Tourniquet for catastrophic limb bleeding \u2014 record time applied (ASTRA addition).",ref:"1-44",critical:!0},{use:"vitals"},{text:"Prevent loss of body heat",vitals:["temp"],ref:"1-44"},{text:"Start I.V.; begin infusing 1 L normal saline",detail:"IV Admin-1, Saline Supply Bag",vitals:["sbp","hr"],ref:"1-44"},{use:"ivgravity"},{text:"Attach ECG leads",vitals:["rhythm","hr"],ref:"1-44"},{if:"Abdominal injury",text:"Bandage (Kling, Kerlix). Protruding intestines \u2014 do not replace; cover with saline-moistened Kerlix",detail:"Watch for rigidity and developing shock; inspect any vomit for blood.",ref:"1-27"},{if:"Chest injury",text:"Do not remove impaled object; Xeroform over puncture; airtight bandage; listen for absent breath sounds",ref:"1-35"},{text:"TXA 1 g IV over 10 min (within 3 h of injury)",detail:"Not in Med C/L Rev K.",surgeon:!0},{use:"contact"}]},{id:5,name:"Chest Pain, Rhythm & Clot",tier:"crit",prior:0,keywords:{"chest pain":5,"chest pressure":5,crushing:3,palpitation:4,"racing heart":4,"heart racing":4,"racing heartbeat":4,irregular:3,heart:1.5,"jaw pain":3,"left arm":3,clot:4,"neck swelling":4,"swollen neck":4,calf:3,tearing:3},sources:[{section:"Chest Pain",page:"1-36"},{section:"Cardiac Monitoring",page:"1-8"},{section:"Indigestion (warning: refer chest pain)",page:"4-6"}],steps:[{use:"abc"},{use:"vitals"},{text:"Chest exam \u2014 heart sounds (regular/irregular), breath sounds, chest wall motion, skin colour",ref:"1-36"},{text:"Attach ECG leads (OBS) \u2014 transmit to ground",vitals:["rhythm","hr"],ref:"1-36",critical:!0},{text:"Aspirin 1 tab",detail:"Drug Subpack-Spine. Not if suspected dissection or bleeding.",ref:"1-36"},{use:"contact"},{if:"Unstable (SBP <90, drowsy, ongoing pain) with arrhythmia",text:"Synchronised cardioversion or pacing per flight surgeon",detail:"Not in Med C/L Rev K.",vitals:["sbp","hr","rhythm"],surgeon:!0,critical:!0},{if:"Neck or limb swelling, or suspected pulmonary embolism",text:"Ultrasound; anticoagulation only after Surgeon review",detail:"Not in Med C/L Rev K. Jugular vein thrombosis has been reported in ISS crew.",surgeon:!0},{kind:"warning",text:"Tearing pain to back or unequal arm BPs \u2192 suspect aortic dissection \u2014 no aspirin or anticoagulant",vitals:["sbp"]}]},{id:6,name:"Neurological Emergency",tier:"crit",prior:0,keywords:{seizure:5,fitting:5,convuls:5,shaking:2,stroke:5,"weak on one side":5,"one side":2,"facial droop":5,slurred:4,speech:2,confus:3,"hit his head":4,"hit her head":4,"head injury":5,"hit head":4,unconscious:3,"passed out":3,drowsy:2,"worst headache":4},sources:[{section:"Seizures",page:"1-42"},{section:"Head or Neck Injury",page:"1-39"}],steps:[{kind:"warning",text:"Neck trauma \u2192 assume fracture or spinal cord damage. Never move the neck",ref:"1-39"},{use:"abc"},{if:"Seizure",text:"Valium 2 mL IM ASAP \u2014 outer middle thigh (upper outer buttock if thin thigh)",detail:"Drug Subpack-22. Do not use a jabbing motion.",surgeon:!0,ref:"1-42",critical:!0},{if:"Seizure continuing 5 min after first Valium",text:"Valium 2 mL IV SLOWLY over 1\u20132 min",surgeon:!0,ref:"1-42"},{text:"Restrain patient to middeck lockers; start I.V.; attach ECG",ref:"1-42"},{text:"Check blood glucose \u2014 if <4 mmol/L go to Metabolic checklist",detail:"Not in Med C/L Rev K.",kind:"goto",goto:9,vitals:["glucose"]},{use:"vitals"},{if:"Bleeding from head or neck",text:"Control with pressure (Gauze/Telfa); bandage with Kling, Kerlix, Ace",ref:"1-39"},{if:"Neck injury suspected",text:"Immobilise head and neck \u2014 Kling, Kerlix, Ace bandages, Gray Tape, towels",ref:"1-39"},{kind:"record",text:"GCS (E + V + M) \u2014 record every 15 min if below 15",ref:"1-39"},{text:"Eyes: pupil size, equality and reaction to light; ears and nose for blood or clear fluid",ref:"1-39"},{use:"contact"},{text:"Seizure can recur \u2014 keep Valium ready. Watch for vomiting; keep airway clear",ref:"1-42"}]},{id:7,name:"Hazardous Atmosphere & Toxic Exposure",tier:"over",prior:-.5,keywords:{smoke:6,fire:6,smell:4,fumes:5,ammonia:6,leak:4,alarm:4,toxic:4,co2:4,"carbon dioxide":4,depress:5,"pressure drop":5,radiation:5,solar:3,dust:4,contamina:4,hydrazine:6,propellant:5,chemical:3,"two crew":3,everyone:2,"all crew":3},sources:[{section:"Hazardous Spill Level Definitions Table",page:"7-2"},{section:"Contaminant Cleanup Procedures",page:"7-5"},{section:"Eye / Skin Exposure Toxicology Treatment",page:"7-6"},{section:"Inhalation Exposure Toxicology Treatment",page:"7-7"},{section:"Radiation \u2014 High Rate Dosimeter",page:"5-4"},{section:"Altitude Sickness",page:"2-4"}],steps:[{text:"Remove individual from further exposure",ref:"7-5",critical:!0},{text:"Don protective equipment by tox level \u2014 4 RED / 3 ORANGE: QDM or SEBS (all crew) \xB7 2 YELLOW: goggles, surgical mask, Silver Shield gloves \xB7 1 BLUE: goggles, mask",vitals:["ppco2","pressure","nh3"],ref:"7-5",critical:!0},{text:"Run the vehicle emergency procedure (fire / depress / toxic) \u2014 isolate module",detail:"Vehicle emergency procedures, not the Med C/L."},{text:"Account for all crew \u2014 triage if more than one casualty"},{kind:"warning",text:"Signs of toxicity may be delayed \u2014 keep exposed crew on QDM until Surgeon contacted",ref:"7-7"},{if:"Eye exposure",text:"Go to Eye Chemical Burn \u2014 emergency eyewash, flush until pH neutral",kind:"goto",goto:14,ref:"7-6"},{if:"Skin exposure",text:"Remove contaminated clothing and toxic material; irrigate with copious water (cold wet gauze if unable to flush)",ref:"7-6"},{if:"Respiratory distress",text:"Record respiratory rate; check SOB, pallor, sweating, retractions, wheeze, mental status",kind:"record",vitals:["rr","spo2"],ref:"7-7"},{kind:"warning",text:"Do NOT give epinephrine after halogenated hydrocarbon exposure (Freon, Halon 1301)",ref:"7-7"},{if:"Unconscious, not breathing, or no pulse",text:"Oxygen and CPR",kind:"goto",goto:1,ref:"7-7"},{if:"Radiation event",text:"Shelter per flight rules; High Rate Dosimeter ON \u2192 record dose rate and dose",ref:"5-4"},{if:"Cabin pressure altitude \u22658000 ft with headache, nausea, breathlessness",text:"Diamox \xBD\u20131 tab every 24 h, 3 doses total",detail:"Drug Subpack-43",surgeon:!0,ref:"2-4"},{text:"Clean up with Contaminant Cleanup Kit; bag and label by hazard level",ref:"7-5"},{use:"contact"}]},{id:8,name:"Pressure & Gas Injury",tier:"crit",prior:-1,keywords:{bends:5,decompression:5,"joint pain":3,"after eva":3,"after the spacewalk":3,tingling:2,embolism:5,"ear pain":3,sinus:3,barotrauma:5,"pressure change":4,"suit pressure":4},sources:[{section:"DCS \u2014 Decompression Sickness (Bends)",page:"3-4"},{section:"EVA DCS Examination Scorecard",page:"3-5"},{section:"DCS Treatment / Aftercare / Late DCS",page:"3-8"},{section:"DCS \u2014 Other Decompression Problems (Barotrauma)",page:"3-10"}],steps:[{kind:"note",text:"Causes: short or interrupted prebreathe, inadequate EMU N\u2082 purge, strenuous EVA, dehydration, loss of cabin/suit pressure. Treatment = repressurisation + 100% O\u2082 over time",ref:"3-4"},{text:"Grade CUFF class \u2014 1 mild pain/paresthesia \xB7 2 interferes with work or resolves on repress \xB7 3 severe, migratory, truncal \xB7 4 neuro or cardiopulmonary",ref:"3-4",critical:!0},{if:"Difficulty breathing, chest discomfort or distress",text:"Go to CPR",kind:"goto",goto:1,ref:"3-8"},{text:"QDM \u2014 100% O\u2082 for 2 hours total",vitals:["spo2"],ref:"3-8",critical:!0},{kind:"record",text:"DCS out-of-suit exam every 15\u201330 min \u2014 report changes to Surgeon",ref:"3-9"},{text:"Minimise activity; hydrate 1 L/h for 2 h (oral, or saline IV if unable to drink)",ref:"3-8"},{if:"CUFF 1\u20133 not improving after 20 min",text:"Increase cabin pressure to 14.7 psi",vitals:["pressure"],ref:"3-9"},{if:"CUFF 4 (neuro or cardiopulmonary)",text:"Increase cabin pressure to 15.56 psi; prepare Bends Treatment Adapter (BTA) in EMU; check MCC for deorbit prep",vitals:["pressure"],ref:"3-9",critical:!0},{if:"Symptoms recur after treatment",text:"Treat as CUFF 4 (recurrent DCS)",ref:"3-10"},{if:"Barotrauma \u2014 ear, sinus, tooth or jaw pain, abdominal distension",text:"Repress if pain is progressive; pain relief",ref:"3-10"},{use:"contact"}]},{id:9,name:"Metabolic, Thermal & Treatment Complications",tier:"std",prior:0,keywords:{diabet:4,sugar:4,glucose:4,hypo:3,overdose:5,"too much":3,medication:2,sedat:4,overheat:4,"too hot":3,cold:1.5,shiver:2,hypotherm:5,dehydrat:4,"dark urine":3,cramp:2,naloxone:4,opioid:3,spasm:3},sources:[{section:"Hot Cabin (total loss of thermal control)",page:"4-5"},{section:"Muscle Spasm (Drug Side Effect)",page:"4-39"},{section:"Medication Side Effects",page:"6-2"},{section:"Vomiting",page:"5-25"}],steps:[{use:"abc"},{if:"Over-sedated",text:"Stimulate, jaw thrust, O\u2082, bag-valve-mask",detail:"Not in Med C/L Rev K.",vitals:["spo2","rr"],critical:!0},{if:"Opioid toxicity",text:"Naloxone 400 mcg IM or 100 mcg IV boluses, repeat",detail:"Not in Med C/L Rev K formulary.",surgeon:!0},{if:"Muscle spasm or eyes rolled up after a drug (e.g. Phenergan)",text:"Benadryl (injectable) 1 mL IM; Contact Surgeon",surgeon:!0,ref:"4-39"},{text:"Check blood glucose",detail:"<4 mmol/L: 15\u201320 g oral glucose or glucagon 1 mg IM. >20: fluids, ketones. Not in Med C/L Rev K.",vitals:["glucose"],critical:!0},{if:"Hot cabin or heat illness",text:"Minimal clothing, limit activity; skin temp monitors; record pulse and skin temp hourly; 8 oz chilled water every 15 min + salt tab with every other",vitals:["temp","hr"],ref:"4-5"},{if:"Hypothermia",text:"Insulate, warm fluids",vitals:["temp"]},{text:"Dehydration / rhabdomyolysis: fluids; monitor urine output and colour"},{text:"Check drug side effects table",ref:"6-2"},{use:"contact"}]},{id:10,name:"Behavioural & Mental Health Crisis",tier:"std",prior:0,keywords:{agitat:5,aggressive:5,violent:5,psycho:4,hallucin:5,paranoi:5,panic:4,anxiety:3,suicid:6,"kill myself":6,hopeless:4,threaten:4,"out of character":3,crying:2,grief:3,"won't calm":4},sources:[{section:"No corresponding procedure in Med C/L Rev K \u2014 ASTRA addition",page:"\u2014"},{section:"Sleeping Problems (Insomnia)",page:"5-13"}],steps:[{kind:"note",text:"Med C/L Rev K has no behavioural-emergency procedure. This checklist is an ASTRA addition and needs flight-surgeon and psychiatry review"},{text:"Crew safety first: space, remove sharps and hazards, \u22652 crew present",critical:!0},{text:"Verbal de-escalation: one speaker, calm simple language, acknowledge feelings"},{text:"Exclude medical causes: glucose, SpO\u2082, head injury, CO\u2082, drugs",vitals:["glucose","spo2","ppco2"]},{text:"Offer oral medication voluntarily",detail:"e.g. olanzapine 10 mg or lorazepam 1\u20132 mg.",surgeon:!0},{if:"Imminent danger to self or others",text:"Coordinated restraint (CMRS straps) + ketamine 4\u20135 mg/kg IM or midazolam 5\u201310 mg IM",surgeon:!0,critical:!0},{text:"After sedation: airway, SpO\u2082, continuous observation",vitals:["spo2","rr"]},{if:"Suicide risk",text:"Never leave alone; remove means; ground psychology support"},{if:"Grief or trauma reaction after a crew event",text:"Rest, peer support, private conference with ground"},{use:"contact"}]},{id:11,name:"Acute Abdomen & Urinary/Reproductive",tier:"std",prior:0,keywords:{abdominal:5,abdomen:5,stomach:4,belly:4,appendi:5,"right lower":4,flank:4,kidney:3,loin:4,"can't pee":5,"cannot urinate":5,"can't urinate":5,testic:5,groin:3,pelvic:4,vomiting:2,nausea:1,"kidney stone":6,stone:4,colic:5,"in waves":2,"comes in waves":3,"my side":3,"side and back":4,"back and side":4,"blood in urine":5,"blood in my urine":5,"blood in my wee":5,"pink urine":4,"peeing blood":5,"pissing blood":5,"feel sick":1,vomit:1},sources:[{section:"Abdominal Pain",page:"2-2"},{section:"Bladder Infection",page:"2-5"},{section:"Urinary Retention",page:"5-23"},{section:"Diarrhea",page:"3-11"}],steps:[{kind:"warning",text:"Chest pain, pressure, sweating, breathlessness or arm pain with \u201Cindigestion\u201D \u2192 Chest Pain checklist",goto:5,ref:"4-6"},{kind:"warning",text:"Fever, rigors or confusion with flank pain \u2192 possible infected, blocked kidney \u2014 Infection & Sepsis checklist now",detail:"Not in Med C/L Rev K. Pending clinician sign-off.",goto:12},{use:"vitals"},{text:"Abdominal exam, all 4 quadrants \u2014 inspection (bruises, swelling), bowel sounds, palpation (rigidity, pain, rebound)",ref:"2-2"},{text:"Contact Surgeon prior to treatment",kind:"contact",ref:"2-2"},{if:"Urinary symptoms (burning, frequency, pain)",text:"Urine Chemstrip 10 SG (Trauma Subpack-15) \u2014 record; Contact Surgeon",ref:"2-5"},{if:"Unable to urinate",text:"Urinary catheter \u2014 Surgeon advises Foley vs straight catheter",detail:"Povidone-iodine, lubricant, catheter (Trauma Subpack-10), leg bag.",ref:"5-23"},{text:"Ultrasound \u2014 free fluid, gallbladder, kidneys, bladder volume",detail:"Not in Med C/L Rev K."},{text:"Analgesia per Pain Relief ladder; antiemetic for nausea",ref:"5-3"},{if:"Suspected appendicitis or cholecystitis",text:"Nil by mouth, IV fluids, antibiotics per Surgeon",surgeon:!0,vitals:["temp","hr","sbp"]},{if:"Sudden testicular pain",text:"Suspect torsion \u2014 urgent ground consult",critical:!0}]},{id:12,name:"Infection & Sepsis",tier:"crit",prior:0,keywords:{fever:5,temperature:3,chills:4,rigor:4,infect:4,pus:4,abscess:5,"red and hot":4,cellulitis:5,flu:3,shingles:5,"burning when":3,feverish:5,shivering:4,"high temperature":4},sources:[{section:"Skin Infection",page:"5-11"},{section:"Bladder Infection",page:"2-5"},{section:"Bronchitis (Cough)",page:"2-7"},{section:"Sore Throat",page:"5-14"}],steps:[{use:"vitals"},{text:"Sepsis screen: temp, HR >90, RR >20, SBP <100, new confusion",detail:"Not in Med C/L Rev K.",vitals:["temp","hr","rr","sbp"],critical:!0},{if:"Septic",text:"IV access; broad-spectrum antibiotics within 1 h; 500 mL fluid bolus, reassess",detail:"Not in Med C/L Rev K.",surgeon:!0},{use:"ivgravity",critical:!0},{text:"Find the source: chest, urine, skin, abdomen, teeth"},{if:"Urinary source with flank pain or known stone",text:"Suspect an infected, blocked kidney \u2014 it needs drainage that cannot be done on board. Contact Surgeon now; plan evacuation or retrieval",detail:"Not in Med C/L Rev K. Pending clinician sign-off.",critical:!0},{if:"Skin infection",text:"Contact Surgeon; photo-document with ruler every 24 h; antibiotic per Surgeon (Augmentin, Cipro, Duricef or Zithromax)",surgeon:!0,ref:"5-11"},{if:"Urinary symptoms",text:"Urine Chemstrip 10 SG \u2014 record results; Contact Surgeon for antibiotic",surgeon:!0,ref:"2-5"},{if:"Cough",text:"Bronchitis procedure",ref:"2-7"},{text:"Contagious? Masks, hand hygiene, separate sleep station"},{use:"contact"}]},{id:13,name:"Wounds, Burns & Limb Injuries",tier:"std",prior:0,keywords:{cut:4,lacerat:5,wound:4,fracture:5,broken:4,dislocat:5,sprain:4,twisted:3,burn:5,scald:4,finger:2,wrist:2,ankle:2,shoulder:2,knee:2,treadmill:3,fingernail:4,glove:2,injur:2},sources:[{section:"Fracture/Dislocation",page:"4-3"},{section:"Lacerations \u2014 Major / Minor",page:"4-30"},{section:"Burns \u2014 Major",page:"1-32"},{section:"Burns \u2014 Minor",page:"2-8"},{section:"Strains/Sprains",page:"5-14"}],steps:[{use:"abc"},{text:"Control bleeding with direct pressure, Gauze Pads (Trauma Subpack-14)",ref:"4-3"},{use:"vitals"},{kind:"warning",text:"Pelvis or upper-leg fractures can cause large blood loss and shock. Treat dislocations as fractures",goto:4,ref:"4-3"},{if:"Fracture
