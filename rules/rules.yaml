# Tiering rules. Rules decide; AI only explains.
# Every rule needs a source, a confidence label and a signed_off_by field, or the app refuses to load.
# signed_off_by is a clinician ROLE (never a name), or the word "placeholder".
#
# STATUS: a rule whose signed_off_by names a clinician role is signed off; every other rule, number and line of
# wording below is a PLACEHOLDER awaiting clinician review.
# The numbers are common statistical conventions, not clinical thresholds. Nothing here is clinical advice.
# See CLINICIAN_REVIEW.md (CR-02, CR-04, CR-12, CR-14, CR-16) and docs/EVIDENCE.md.
version: "0.2"

# The personal band: the person's own baseline mean, plus or minus k standard deviations of their own
# baseline readings. For haemoglobin the standard deviation comes from real crew data (NASA OSDR, OSD-569).
band:
  method: baseline-mean-sd
  k: 2

green:
  title: "{region}: within your own range"
  why: "Your {indicator} is {value} {unit}. That is inside your own expected range of {bandLow} to {bandHigh} {unit}."

titles:
  amber: "{region}: change from your own range"
  red: "{region}: needs action now"

rules:
  - id: LM-01
    kind: limit
    tier: red
    why: "Your {indicator} is {value} {unit}. That is {direction} than your own expected range of {bandLow} to {bandHigh} {unit}, and beyond the {limitLabel} of {limit} {unit}."
    source: "Signed off by the clinical lead on 15 Nov 2026 (CR-02, CR-12, CR-14, CR-16). The limit itself is sourced: see the indicator."
    confidence: Medium
    signed_off_by: clinical lead
  - id: SU-01
    kind: sustained
    tier: red
    count: 3
    why: "Your last {count} readings of {indicator} were all {direction} than your own expected range of {bandLow} to {bandHigh} {unit}. One reading can be a slip. Three in a row is a pattern."
    source: "Signed off by the clinical lead on 15 Nov 2026 (CR-02, CR-12, CR-14, CR-16). Three consecutive readings is a statistical convention."
    confidence: Low
    signed_off_by: clinical lead
  - id: PB-01
    kind: level
    tier: amber
    why: "Your {indicator} is {value} {unit}. That is {direction} than your own expected range of {bandLow} to {bandHigh} {unit}."
    source: "Signed off by the clinical lead on 15 Nov 2026 (CR-02, CR-12, CR-14, CR-16). The band is your own baseline mean plus or minus 2 standard deviations."
    confidence: Low
    signed_off_by: clinical lead
  - id: TR-01
    kind: trend
    tier: amber
    window: 7
    shift_sd: 1
    why: "Your {indicator} has drifted. Your last {window} readings average {trendMean} {unit}, against your baseline of {baselineMean} {unit}. Each reading alone can look fine while the trend does not."
    source: "Signed off by the clinical lead on 15 Nov 2026 (CR-02, CR-12, CR-14, CR-16). A seven-reading average that moves one standard deviation is a statistical convention."
    confidence: Low
    signed_off_by: clinical lead

# Day-level rules: they look across indicators for one person on one day.
combined:
  id: CM-01
  min_flags: 2
  title: "Several signals have moved together"
  why: "{count} of today's check-ins are outside their usual range: {list}. They are shown together so that none is read alone."
  source: "Signed off by the clinical lead on 15 Nov 2026 (CR-16): two or more flags shown together at the highest tier among them."
  confidence: Low
  signed_off_by: clinical lead

prompts:
  - id: PR-01
    when_flagged: [sleep, cabin-co2]
    then_prompt: reaction
    why: "Poor sleep and raised cabin carbon dioxide can both slow thinking. A reaction check shows whether they have."
    source: "Placeholder rule, awaiting clinician review. The link is described in the team's challenge brief."
    confidence: Low
    signed_off_by: placeholder

# Symptom pathways: a pattern of logged symptoms the rules act on. A pathway names a pattern to CHECK FOR
# and the next steps. It never names a finding. core symptoms open the follow-up questions; core plus
# min_supporting supporting symptoms is amber; any urgent symptom on top is red.
# KS-01 and KS-00 are signed off by the clinical lead (15 Nov 2026).
pathways:
  - id: KS-01
    name: "Possible kidney stone"
    region: "Kidneys and urine"
    core: ["Pain in side or lower back"]
    supporting: ["Comes in waves", "Blood in urine", "Pain passing urine", "Nauseous", "Urine looks unusual"]
    min_supporting: 1
    urgent: ["Fever or chills", "Confused", "Cannot pass urine"]
    # A measured fever in the latest vital signs counts as "Fever or chills" (CR-58). 38.0 °C is the fever line in
    # ANZCOR Guideline 9.2.3 (approved December 2025) and the same value SEP-01 uses. Confirmed by the clinical lead, 15 Nov 2026.
    from_vitals:
      "Fever or chills": { temp: ">= 38" }
    context: [fluid, exercise]
    # Early warning, before any symptom: the indicator has sat more than shift_sd standard deviations below the
    # person's own baseline for count logged days in a row. It names a risk to act on early, not a finding.
    early:
      id: KS-00
      indicator: fluid
      count: 3
      shift_sd: 1
      title: "Kidneys and urine: low fluid for {count} days"
      why: "Your fluid intake has been below your usual level for {count} logged days in a row: {values} {unit}, against your baseline of {baselineMean} {unit}. NASA names dehydration and low urine output among the reasons kidney stones are a risk in spaceflight. This is a risk to act on early, not a finding."
      steps:
        - "Drink to your usual daily amount today."
        - "Log your fluid again this evening."
        - "Tell your crew medic if it is still low tomorrow."
      # While the warning stands, ask for blood pressure and pulse until the latest set of vital signs has both (CR-28).
      vitals_check:
        title: "Check your blood pressure and pulse"
        why: "Low fluid can make blood pressure drop and pulse rise. Record them in vital signs."
        fields: [sbp, hr]
      source: "Three days and one standard deviation kept by the clinical lead on 15 Nov 2026 (CR-29), after the alarm replay showed two days fired more than three times as often on unchanged data. The risk is NASA's: Evidence Report, Risk of Renal Stone Formation (2017), page 5."
      confidence: Low
      signed_off_by: clinical lead
    # Simple tests the pathway asks for. The result is logged and sent with the case. It never changes a tier.
    tests:
      - id: urine-strip
        label: "Blood"
        options: ["Present", "Not present", "Not done"]
      - id: urine-nitrite
        label: "Nitrite"
        options: ["Positive", "Negative", "Not done"]
      - id: urine-leuk
        label: "Leucocytes"
        options: ["Positive", "Negative", "Not done"]
      - id: urine-sg
        label: "Specific gravity"
        options: ["1.005", "1.010", "1.015", "1.020", "1.025", "1.030", "Not done"]
    # One plain line shown when the strip results match. Wording confirmed by the clinical lead, 15 Nov 2026 (CR-41).
    # Only the earliest note whose results all match is shown, so the most specific is listed at the top (CR-41).
    # A note with crew_medic adds that line to the top of the alert and puts its steps first (CR-31). No emergency mode.
    test_notes:
      - when: { urine-strip: "Present", urine-nitrite: "Positive", urine-leuk: "Positive" }
        text: "Blood, nitrite and leucocytes present: possible infection."
        crew_medic: "Crew medic: the urine strip suggests possible infection. Review today."
        steps: ["Tell your crew medic now.", "Check for fever or other symptoms, such as vomiting, and log them.", "Record your vital signs."]
      - when: { urine-nitrite: "Positive", urine-leuk: "Positive" }
        text: "Nitrite and leucocytes present: possible infection."
        crew_medic: "Crew medic: the urine strip suggests possible infection. Review today."
        steps: ["Tell your crew medic now.", "Check for fever or other symptoms, such as vomiting, and log them.", "Record your vital signs."]
      - when: { urine-strip: "Present", urine-nitrite: "Negative", urine-leuk: "Negative" }
        text: "Blood present, no signs of infection."
    # Three yes/no questions that open the "Kidneys and urine" area in "Feeling off?" (CR-54).
    # A question with a symptom logs it on Yes; the pain question shows where it hurts.
    questions:
      zone: kidneys
      pain_where: "Where is the pain?"
      items:
        - { ask: "Do you have any pain right now?" }
        - { ask: "Can you see any blood in your urine?", symptom: "Blood in urine" }
        - { ask: "Does your urine look unusual in any other way, such as cloudy, dark or foamy?", symptom: "Urine looks unusual" }
    # Ask for a pain score every 30 minutes until 3 in a row are below 3 (CR-27). The score never changes a tier.
    pain_repeat:
      every_minutes: 30
      settled_below: 3
      settled_count: 3
      next: "Next pain score due at {time}."
      due: "Pain score due"
      settled: "Pain has settled. No more pain scores needed unless it comes back."
    # Shown on the countdown to Earth's reply once the case is sent (CR-26).
    while_waiting: "While you wait: pain relief as your crew medic's protocol sets out, and keep drinking."
    check:
      title: "Pain in your side or lower back: three quick questions"
      why: "You logged {core}. Pain here has many causes. Three quick questions tell the rules whether your crew medic should check for a kidney stone."
    titles:
      amber: "Kidneys and urine: tell your crew medic today"
      red: "Kidneys and urine: needs action now"
    why:
      amber: "You logged {symptoms}. Together these match the pattern your crew medic checks for a kidney stone. This is a pattern to check, not a diagnosis."
      red: "You logged {symptoms}. With {urgent}, the pattern your crew medic checks for a kidney stone needs action now. This is a pattern to check, not a diagnosis."
    steps:
      # Step wording from the team's clinical lead (build pack v3.3), signed off 15 Nov 2026 (CR-43). No drug names or doses.
      amber:
        - "Tell your crew medic."
        - "Run the urine test strip."
        - "Follow the guided ultrasound."
        - "Keep drinking, and strain your urine."
        - "Pain relief as your crew medic's protocol sets out."
        - "Log your pain score now, and again whenever it changes."
        - "Send the case to Earth."
      red:
        - "Tell your crew medic now."
        - "Open emergency mode."
        - "Record vital signs."
        - "Log your pain score now, and again whenever it changes."
        - "Send the case to Earth."
    background:
      - text: "NASA lists kidney stones as a spaceflight risk: “Exposure to microgravity induces bone atrophy/bone loss which increases circulating calcium”."
        source: "NASA, Risk of Renal Stone Formation"
        link: "https://www.nasa.gov/directorates/esdmd/hhp/risk-of-renal-stone-formation/"
      - text: "NASA's guidance on prevention is fluid and exercise: crew should be “encouraged to drink an adequate amount”, and exercise lowers “the amount of stone forming calcium in urine”. For the crew medic, NASA notes that “ultrasound and limited lab work can detect and help enable stone risk management”."
        source: "NASA OCHMO Medical Technical Brief MTB-003, Urinary Health, Rev A"
        link: "https://www.nasa.gov/wp-content/uploads/2025/01/ochmo-mtb-003-urinary-health.pdf"
      - text: "NASA reports: “A total of 43 stone events in 29 crewmembers have been recorded by NASA since 2016.” One episode has been reported during spaceflight itself."
        source: "NASA OCHMO Medical Technical Brief MTB-003, Urinary Health, Rev A, page 6"
        link: "https://www.nasa.gov/wp-content/uploads/2025/01/ochmo-mtb-003-urinary-health.pdf#page=6"
    source: "Signed off by the clinical lead on 15 Nov 2026 (CR-25 to CR-28, CR-31, CR-41, CR-43, CR-54, CR-57, CR-58). The symptom pattern follows public guidance (healthdirect Australia, Kidney stones; NIDDK, Kidney stones: symptoms and causes). The fever line is ANZCOR Guideline 9.2.3. The risk is NASA's: Risk of Renal Stone Formation."
    confidence: Medium
    signed_off_by: clinical lead

  # The mental health red pathway (CR-10, CR-44): thoughts of suicide, of harming yourself or someone else, or having
  # harmed yourself. Act now on one symptom. Shared with the crew medic and the commander at once: safety comes before
  # privacy here, as in a risk-of-harm situation on Earth.
  - id: MH-01
    name: "Mental health red pathway"
    region: "Mental health"
    core: ["Thoughts of suicide", "Thoughts of harming myself", "Have harmed myself", "Thoughts of harming someone else"]
    supporting: []
    min_supporting: 0
    urgent: []
    context: [mood, sleep]
    share_now: true
    privacy_note: "Shared with your crew medic and the commander now. Safety comes before privacy here."
    ask_after: { indicator: mood, at_or_below: 2, ask: "Have you had any thoughts of suicide, or of harming yourself or someone else?" }
    check:
      title: "Mental health: a quick question"
      why: "You logged {core}."
    titles:
      amber: "Mental health: needs action now"
      red: "Mental health: needs action now"
    why:
      amber: "You logged {symptoms}. This needs a person with you, and someone to talk to, now."
      red: "You logged {symptoms}. This needs a person with you, and someone to talk to, now."
    steps:
      amber:
        - "Tell your crew medic now. The commander is told as well."
        - "Stay with a crewmate. Do not stay alone."
        - "Move anything that could be used to cause harm out of reach."
        - "Send the case to Earth for a private call with the flight surgeon."
      red:
        - "Tell your crew medic now. The commander is told as well."
        - "Stay with a crewmate. Do not stay alone."
        - "Move anything that could be used to cause harm out of reach."
        - "Send the case to Earth for a private call with the flight surgeon."
    source: "Asked for by the clinical lead on 15 Nov 2026 (CR-10, CR-44). Suicide and having harmed yourself added, and the step to move anything that could cause harm out of reach, on the build assistant's recommendation, approved by the clinical lead."
    confidence: Low
    signed_off_by: clinical lead

steps:
  green:
    - "Log the reading."
    - "Check in again at your next scheduled time."
  amber:
    - "Repeat the reading to confirm."
    - "Tell your crew medic."
    - "Send the case to Earth."
  # A Watch from one reading that a repeat has not yet backed (CR-35): the crew member repeats it first. The crew medic
  # and Earth are brought in once a repeat agrees. Act now is never held back.
  amber_unconfirmed:
    - "Repeat the reading to confirm."
    - "If the repeat is also outside your range, tell your crew medic and send the case to Earth."
  red:
    - "Tell your crew medic now."
    - "Repeat the reading to confirm."
    - "Send the case to Earth."

# Monitor alerts: rules that read ONE set of vital signs (the latest), not a trend.
# Each rule fires when ANY of its "when" groups matches, and a group matches when ALL of its comparisons hold.
# A comparison is a field (temp in °C, hr pulse a minute, sbp and dbp blood pressure in mmHg, rr breaths a minute)
# with one of >=, <=, > or < and a number. A missing value never matches.
# Oxygen saturation (spo2) never raises an alert on its own: readings run lower and are less reliable at low
# cabin pressure. The parser refuses a group that compares spo2 alone. Neither rule below uses it.
# A step is plain text, or { text, gravity: [bands] } to show it only in those gravity bands (zero, lunar, martian, earth),
# taken from the place's location profile. A step limited to some bands is hidden when the band is not known.
# construct is the emergency module's pathway number: 12 Infection and sepsis, 4 Shock.
# No cardiac arrest rule here: a set of vital signs carries no heart rhythm.
# STATUS: SEP-01 and SHK-01 signed off by the clinical lead (15 Nov 2026, CR-36 to CR-38).
monitor_alerts:
  - id: SEP-01
    name: "Possible sepsis"
    title: "Possible sepsis: start now"
    checks_for: "Checks for sepsis, an infection spreading through the body: a fever or a low temperature, with low blood pressure or fast breathing at rest."
    construct: 12
    when:
      - { temp: ">= 38", sbp: "<= 100" }
      - { temp: ">= 38", rr: ">= 22" }
      - { temp: "<= 36", sbp: "<= 100", rr: ">= 22" }
    steps:
      - { text: "Lie the person flat and keep them warm.", gravity: [lunar, martian, earth] }
      - { text: "Keep the person warm.", gravity: [zero] }
      - { text: "Strap the person down so you can start CPR if needed.", gravity: [zero] }
      - "Record vitals from the monitor."
      - "Crew medic: follow your sepsis protocol."
    source: "Thresholds from the team's clinical lead (build pack v3.3), signed off by the clinical lead on 15 Nov 2026 (CR-36, CR-38)."
    confidence: Medium
    signed_off_by: clinical lead
  - id: SHK-01
    name: "Possible shock"
    title: "Possible shock: start now"
    checks_for: "Checks for shock, when blood is not reaching the body well enough: low blood pressure with a fast pulse, at rest."
    construct: 4
    when:
      - { sbp: "< 90", hr: "> 110" }
    # Steps approved by the clinical lead on 15 Nov 2026 (CR-37), in our own words after ANZCOR Guideline 9.2.3.
    steps:
      - { text: "Lie the person flat and keep them warm unless they already feel hot.", gravity: [lunar, martian, earth] }
      - { text: "Keep the person warm unless they already feel hot.", gravity: [zero] }
      - { text: "Strap the person down so you can start CPR if needed.", gravity: [zero] }
      - "Control any bleeding straight away."
      - "Give oxygen if it is available and you are trained to. Oxygen is a fire risk: keep sparks and flames away."
      - "Record vitals from the monitor."
      - "If they stop responding and are not breathing normally, press Emergency."
      - "Stay with them, reassure them, and re-check them often."
      - text: "Crew medic: work through a systems screen to look for the cause."
        checklist:
          - heading: "Blood or fluid loss"
            checks: ["Any bleeding, seen or possibly hidden (injury, belly pain)", "Vomiting or diarrhoea", "Heavy sweating", "Burns", "Low fluid intake (the fluid trend in the app)"]
          - heading: "Heart"
            checks: ["Chest pain", "A new irregular pulse", "New breathlessness"]
          - heading: "Widened blood vessels"
            checks: ["Signs of infection (fever, or the sepsis alert)", "Allergic reaction (rash, swelling, wheeze)", "Head or spine injury"]
          - heading: "Blockage"
            checks: ["Sudden breathlessness with one side of the chest moving less", "A recent chest injury", "Sudden chest pain with breathlessness"]
      - "Crew medic: if trained, do a RUSH scan (Rapid Ultrasound in Shock and Hypotension)."
    source: "Thresholds from the team's clinical lead (build pack v3.3), signed off by the clinical lead on 15 Nov 2026 (CR-37). Steps and systems screen approved by the clinical lead on 15 Nov 2026, after ANZCOR Guideline 9.2.3 (approved December 2025)."
    confidence: Low
    signed_off_by: clinical lead

# Runs of days below a fixed amount that are Act now whatever the person's own range, even for a signal capped at
# Watch (CR-44). Each counts the person's logged days, today included.
absolute_runs:
  - id: FL-01
    indicator: fluid
    below: 1
    count: 3
    title: "Food and fluid: needs action now"
    why: "Your fluid intake has been under 1 L for {count} logged days in a row: {values} L. This needs action now."
    steps:
      - "Tell your crew medic now."
      - "Drink now, and keep logging what you drink."
      - "Check your blood pressure and pulse."
    source: "Set by the clinical lead on 15 Nov 2026 (CR-44)."
    confidence: Low
    signed_off_by: clinical lead

# A forecast solar radiation storm at or above alarm_at on the NOAA solar radiation storm scale (S1 to S5) raises a red
# pop-up on every screen until acknowledged, then a banner until the all-clear (CR-09). Not shown where there is no
# habitat (the Earth twin), where the atmosphere and magnetic field protect people. Wave times come from the forecast.
radiation_storm:
  id: RS-01
  alarm_at: S3
  title: "Solar radiation storm: go to shelter"
  lines:
    - "A dangerous solar particle event is forecast."
    - "Go to the storm shelter now and stay there until the all-clear."
    - "Stop or postpone any EVA."
    - "Wear your personal dosimeter."
  acknowledge: "I have read this"
  banner: "Solar radiation storm: stay in the storm shelter until the all-clear."
  source: "Wording and behaviour approved by the clinical lead on 15 Nov 2026 (CR-09). The trigger level S3 is where the NOAA Space Weather Prediction Center solar radiation storm scale advises radiation hazard avoidance for astronauts on EVA; awaiting the clinical lead's confirmation of the level."
  confidence: Low
  signed_off_by: placeholder

# Symptoms that ask for a set of vital signs when logged with no set taken since (CR-58), so the monitor alerts
# (such as SEP-01) can run on measured values. Shown on Today and on the pathway screen until a set is recorded.
vitals_prompt:
  id: VP-01
  symptoms: ["Fever or chills"]
  title: "Record your vital signs"
  why: "You logged {symptom}. Record your vital signs now, so the sepsis check can run on measured values."
  source: "Asked for and approved by the clinical lead on 15 Nov 2026 (CR-58)."
  confidence: Medium
  signed_off_by: clinical lead

# Symptoms that mean "press Emergency now" the moment one is logged. No pattern, no second symptom, no wait.
# The app shows a red banner on every screen until the symptom is cleared. It names no condition.
emergency_symptoms:
  id: EMS-01
  title: "Press Emergency now"
  symptoms: ["Chest pain", "Short of breath", "Collapse"]
  # Which checklist in the emergency module each symptom opens. A symptom with none opens the built-in Emergency steps.
  checklists:
    "Chest pain": { construct: 5, label: "Open chest pain checklist" }
    "Short of breath": { construct: 2, label: "Open breathing checklist" }
  why: "Chest pain, shortness of breath and collapse are treated as an emergency until a clinician says otherwise."
  source: "List from the team's clinicians (review of the build, 15 Nov 2026), signed off by the clinical lead on 15 Nov 2026 (CR-59)."
  confidence: High
  signed_off_by: clinical lead
