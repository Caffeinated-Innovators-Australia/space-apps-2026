# Tiering rules. Rules decide; AI only explains.
# Every rule needs a source, a confidence label and a signed_off_by field, or the app refuses to load.
# signed_off_by is a clinician ROLE (never a name), or the word "placeholder".
#
# STATUS: every rule, number and line of wording below is a PLACEHOLDER awaiting clinician review.
# The numbers are common statistical conventions, not clinical thresholds. Nothing here is clinical advice.
# See CLINICIAN_REVIEW.md (CR-02, CR-04, CR-12, CR-14, CR-16) and docs/EVIDENCE.md.
version: "0.2"

# The personal band: the person's own baseline mean, plus or minus k standard deviations of their own
# baseline readings. For haemoglobin the standard deviation comes from real crew data (NASA OSDR, OSD-569).
band:
  method: baseline-mean-sd
  k: 2

green:
  title: "{region}: within your own range"
  why: "Your {indicator} is {value} {unit}. That is inside your own expected range of {bandLow} to {bandHigh} {unit}."

titles:
  amber: "{region}: change from your own range"
  red: "{region}: needs action now"

rules:
  - id: LM-01
    kind: limit
    tier: red
    why: "Your {indicator} is {value} {unit}. That is {direction} than your own expected range of {bandLow} to {bandHigh} {unit}, and beyond the {limitLabel} of {limit} {unit}."
    source: "Placeholder rule, awaiting clinician review. The limit itself is sourced: see the indicator."
    confidence: Low
    signed_off_by: placeholder
  - id: SU-01
    kind: sustained
    tier: red
    count: 3
    why: "Your last {count} readings of {indicator} were all {direction} than your own expected range of {bandLow} to {bandHigh} {unit}. One reading can be a slip. Three in a row is a pattern."
    source: "Placeholder rule, awaiting clinician review. Three consecutive readings is a statistical convention."
    confidence: Low
    signed_off_by: placeholder
  - id: PB-01
    kind: level
    tier: amber
    why: "Your {indicator} is {value} {unit}. That is {direction} than your own expected range of {bandLow} to {bandHigh} {unit}."
    source: "Placeholder rule, awaiting clinician review. The band is your own baseline mean plus or minus 2 standard deviations."
    confidence: Low
    signed_off_by: placeholder
  - id: TR-01
    kind: trend
    tier: amber
    window: 7
    shift_sd: 1
    why: "Your {indicator} has drifted. Your last {window} readings average {trendMean} {unit}, against your baseline of {baselineMean} {unit}. Each reading alone can look fine while the trend does not."
    source: "Placeholder rule, awaiting clinician review. A seven-reading average that moves one standard deviation is a statistical convention."
    confidence: Low
    signed_off_by: placeholder

# Day-level rules: they look across indicators for one person on one day.
combined:
  id: CM-01
  min_flags: 2
  title: "Several signals have moved together"
  why: "{count} of today's check-ins are outside their usual range: {list}. They are shown together so that none is read alone."
  source: "Placeholder rule, awaiting clinician review."
  confidence: Low
  signed_off_by: placeholder

prompts:
  - id: PR-01
    when_flagged: [sleep, cabin-co2]
    then_prompt: reaction
    why: "Poor sleep and raised cabin carbon dioxide can both slow thinking. A reaction check shows whether they have."
    source: "Placeholder rule, awaiting clinician review. The link is described in the team's challenge brief."
    confidence: Low
    signed_off_by: placeholder

# Symptom pathways: a pattern of logged symptoms the rules act on. A pathway names a pattern to CHECK FOR
# and the next steps. It never names a finding. core symptoms open the follow-up questions; core plus
# min_supporting supporting symptoms is amber; any urgent symptom on top is red.
# Every symptom, tier and step below is a PLACEHOLDER awaiting clinician review (CR-25 to CR-28).
pathways:
  - id: KS-01
    name: "Possible kidney stone"
    region: "Kidneys and urine"
    core: ["Pain in side or lower back"]
    supporting: ["Comes in waves", "Blood in urine", "Pain passing urine", "Nauseous"]
    min_supporting: 1
    urgent: ["Fever or chills", "Confused", "Cannot pass urine"]
    context: [fluid, exercise]
    # Early warning, before any symptom: the indicator has sat more than shift_sd standard deviations below the
    # person's own baseline for count logged days in a row. It names a risk to act on early, not a finding.
    early:
      id: KS-00
      indicator: fluid
      count: 3
      shift_sd: 1
      title: "Kidneys and urine: low fluid for {count} days"
      why: "Your fluid intake has been below your usual level for {count} logged days in a row: {values} {unit}, against your baseline of {baselineMean} {unit}. NASA names dehydration and low urine output among the reasons kidney stones are a risk in spaceflight. This is a risk to act on early, not a finding."
      steps:
        - "Drink to your usual daily amount today."
        - "Log your fluid again this evening."
        - "Tell your crew medic if it is still low tomorrow."
      source: "Placeholder rule, awaiting clinician review. Three days and one standard deviation are statistical conventions. The risk is NASA's: Evidence Report, Risk of Renal Stone Formation (2017), page 5."
      confidence: Low
      signed_off_by: placeholder
    # Simple tests the pathway asks for. The result is logged and sent with the case. It never changes a tier.
    tests:
      - id: urine-strip
        label: "Blood"
        options: ["Present", "Not present", "Not done"]
      - id: urine-nitrite
        label: "Nitrite"
        options: ["Positive", "Negative", "Not done"]
      - id: urine-leuk
        label: "Leucocytes"
        options: ["Positive", "Negative", "Not done"]
      - id: urine-sg
        label: "Specific gravity"
        options: ["1.005", "1.010", "1.015", "1.020", "1.025", "1.030", "Not done"]
    # One plain line shown when the strip results match exactly. Wording from the clinical lead, a placeholder until signed off.
    test_notes:
      - when: { urine-strip: "Present", urine-nitrite: "Negative", urine-leuk: "Negative" }
        text: "Blood present, no signs of infection."
    check:
      title: "Pain in your side or lower back: three quick questions"
      why: "You logged {core}. Pain here has many causes. Three quick questions tell the rules whether your crew medic should check for a kidney stone."
    titles:
      amber: "Kidneys and urine: tell your crew medic today"
      red: "Kidneys and urine: needs action now"
    why:
      amber: "You logged {symptoms}. Together these match the pattern your crew medic checks for a kidney stone. This is a pattern to check, not a diagnosis."
      red: "You logged {symptoms}. With {urgent}, the pattern your crew medic checks for a kidney stone needs action now. This is a pattern to check, not a diagnosis."
    steps:
      # Step wording from the team's clinical lead (build pack v3.3). Placeholder until signed off. No drug names or doses.
      amber:
        - "Tell your crew medic."
        - "Run the urine test strip."
        - "Follow the guided ultrasound."
        - "Keep drinking, and strain your urine."
        - "Pain relief as your crew medic's protocol sets out."
        - "Log your pain score now, and again whenever it changes."
        - "Send the case to Earth."
      red:
        - "Tell your crew medic now."
        - "Open emergency mode."
        - "Record vital signs."
        - "Log your pain score now, and again whenever it changes."
        - "Send the case to Earth."
    background:
      - text: "NASA lists kidney stones as a spaceflight risk: “Exposure to microgravity induces bone atrophy/bone loss which increases circulating calcium”."
        source: "NASA, Risk of Renal Stone Formation"
        link: "https://www.nasa.gov/directorates/esdmd/hhp/risk-of-renal-stone-formation/"
      - text: "NASA's guidance on prevention is fluid and exercise: crew should be “encouraged to drink an adequate amount”, and exercise lowers “the amount of stone forming calcium in urine”. For the crew medic, NASA notes that “ultrasound and limited lab work can detect and help enable stone risk management”."
        source: "NASA OCHMO Medical Technical Brief MTB-003, Urinary Health, Rev A"
        link: "https://www.nasa.gov/wp-content/uploads/2025/01/ochmo-mtb-003-urinary-health.pdf"
      - text: "NASA reports: “A total of 43 stone events in 29 crewmembers have been recorded by NASA since 2016.” One episode has been reported during spaceflight itself."
        source: "NASA OCHMO Medical Technical Brief MTB-003, Urinary Health, Rev A, page 6"
        link: "https://www.nasa.gov/wp-content/uploads/2025/01/ochmo-mtb-003-urinary-health.pdf#page=6"
    source: "Placeholder rule, awaiting clinician review. The symptom pattern follows public guidance (healthdirect Australia, Kidney stones; NIDDK, Kidney stones: symptoms and causes). The risk is NASA's: Risk of Renal Stone Formation."
    confidence: Low
    signed_off_by: placeholder

steps:
  green:
    - "Log the reading."
    - "Check in again at your next scheduled time."
  amber:
    - "Repeat the reading to confirm."
    - "Tell your crew medic."
    - "Send the case to Earth."
  red:
    - "Tell your crew medic now."
    - "Repeat the reading to confirm."
    - "Send the case to Earth."

# Monitor alerts: rules that read ONE set of vital signs (the latest), not a trend.
# Each rule fires when ANY of its "when" groups matches, and a group matches when ALL of its comparisons hold.
# A comparison is a field (temp in °C, hr pulse a minute, sbp and dbp blood pressure in mmHg, rr breaths a minute)
# with one of >=, <=, > or < and a number. A missing value never matches.
# Oxygen saturation (spo2) never raises an alert on its own: readings run lower and are less reliable at low
# cabin pressure. The parser refuses a group that compares spo2 alone. Neither rule below uses it.
# construct is the emergency module's pathway number: 12 Infection and sepsis, 4 Shock.
# No cardiac arrest rule here: a set of vital signs carries no heart rhythm.
# STATUS: every threshold and step below is the clinical lead's placeholder (build pack v3.3), awaiting sign-off.
monitor_alerts:
  - id: SEP-01
    name: "Possible sepsis"
    title: "Possible sepsis: start now"
    checks_for: "Checks for sepsis, an infection spreading through the body: a fever or a low temperature, with low blood pressure or fast breathing."
    construct: 12
    when:
      - { temp: ">= 38", sbp: "<= 100" }
      - { temp: ">= 38", rr: ">= 22" }
      - { temp: "<= 36", sbp: "<= 100", rr: ">= 22" }
    steps:
      - "Lie the person flat and keep them warm."
      - "Record vitals from the monitor."
      - "Crew medic: follow your sepsis protocol."
    source: "Placeholder thresholds from the team's clinical lead (build pack v3.3), awaiting sign-off."
    confidence: Low
    signed_off_by: placeholder
  - id: SHK-01
    name: "Possible shock"
    title: "Possible shock: start now"
    checks_for: "Checks for shock, when blood is not reaching the body well enough: low blood pressure with a fast pulse."
    construct: 4
    when:
      - { sbp: "< 90", hr: "> 110" }
    steps:
      - "Lie the person flat and keep them warm."
      - "Record vitals from the monitor."
    source: "Placeholder thresholds from the team's clinical lead (build pack v3.3), awaiting sign-off."
    confidence: Low
    signed_off_by: placeholder
