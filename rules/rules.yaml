# Tiering rules. Rules decide; AI only explains.
# Every rule needs a source, a confidence label and a signed_off_by field, or the app refuses to load.
# signed_off_by is a clinician ROLE (never a name), or the word "placeholder".
#
# STATUS: every rule, number and line of wording below is a PLACEHOLDER awaiting clinician review.
# The numbers are common statistical conventions, not clinical thresholds. Nothing here is clinical advice.
# See CLINICIAN_REVIEW.md (CR-02, CR-04, CR-12, CR-14, CR-16) and docs/EVIDENCE.md.
version: "0.2"

# The personal band: the person's own baseline mean, plus or minus k standard deviations of their own
# baseline readings. For haemoglobin the standard deviation comes from real crew data (NASA OSDR, OSD-569).
band:
  method: baseline-mean-sd
  k: 2

green:
  title: "{region}: within your own range"
  why: "Your {indicator} is {value} {unit}. That is inside your own expected range of {bandLow} to {bandHigh} {unit}."

titles:
  amber: "{region}: change from your own range"
  red: "{region}: needs action now"

rules:
  - id: LM-01
    kind: limit
    tier: red
    why: "Your {indicator} is {value} {unit}. That is {direction} than your own expected range of {bandLow} to {bandHigh} {unit}, and beyond the {limitLabel} of {limit} {unit}."
    source: "Placeholder rule, awaiting clinician review. The limit itself is sourced: see the indicator."
    confidence: Low
    signed_off_by: placeholder
  - id: SU-01
    kind: sustained
    tier: red
    count: 3
    why: "Your last {count} readings of {indicator} were all {direction} than your own expected range of {bandLow} to {bandHigh} {unit}. One reading can be a slip. Three in a row is a pattern."
    source: "Placeholder rule, awaiting clinician review. Three consecutive readings is a statistical convention."
    confidence: Low
    signed_off_by: placeholder
  - id: PB-01
    kind: level
    tier: amber
    why: "Your {indicator} is {value} {unit}. That is {direction} than your own expected range of {bandLow} to {bandHigh} {unit}."
    source: "Placeholder rule, awaiting clinician review. The band is your own baseline mean plus or minus 2 standard deviations."
    confidence: Low
    signed_off_by: placeholder
  - id: TR-01
    kind: trend
    tier: amber
    window: 7
    shift_sd: 1
    why: "Your {indicator} has drifted. Your last {window} readings average {trendMean} {unit}, against your baseline of {baselineMean} {unit}. Each reading alone can look fine while the trend does not."
    source: "Placeholder rule, awaiting clinician review. A seven-reading average that moves one standard deviation is a statistical convention."
    confidence: Low
    signed_off_by: placeholder

# Day-level rules: they look across indicators for one person on one day.
combined:
  id: CM-01
  min_flags: 2
  title: "Several signals have moved together"
  why: "{count} of today's check-ins are outside their usual range: {list}. Signals that move together matter more than any one alone."
  source: "Placeholder rule, awaiting clinician review."
  confidence: Low
  signed_off_by: placeholder

prompts:
  - id: PR-01
    when_flagged: [sleep, cabin-co2]
    then_prompt: reaction
    why: "Poor sleep and raised cabin carbon dioxide can both slow thinking. A thirty-second reaction test shows whether they have."
    source: "Placeholder rule, awaiting clinician review. The link is described in the team's challenge brief."
    confidence: Low
    signed_off_by: placeholder

# Symptom pathways: a pattern of logged symptoms the rules act on. A pathway names a pattern to CHECK FOR
# and the next steps. It never names a finding. core symptoms open the follow-up questions; core plus
# min_supporting supporting symptoms is amber; any urgent symptom on top is red.
# Every symptom, tier and step below is a PLACEHOLDER awaiting clinician review (CR-25 to CR-28).
pathways:
  - id: KS-01
    name: "Possible kidney stone"
    region: "Kidneys and urine"
    core: ["Pain in side or lower back"]
    supporting: ["Blood in urine", "Pain passing urine", "Nauseous"]
    min_supporting: 1
    urgent: ["Fever or chills", "Cannot pass urine"]
    context: [fluid, exercise]
    check:
      title: "Pain in your side or lower back: three quick questions"
      why: "You logged {core}. Pain here has many causes. Three quick questions tell the rules whether your crew medic should check for a kidney stone."
    titles:
      amber: "Kidneys and urine: symptoms for your crew medic"
      red: "Kidneys and urine: needs action now"
    why:
      amber: "You logged {symptoms}. Together these match the pattern your crew medic checks for a kidney stone. This is a pattern to check, not a diagnosis."
      red: "You logged {symptoms}. With {urgent}, the pattern your crew medic checks for a kidney stone needs action now. This is a pattern to check, not a diagnosis."
    steps:
      amber:
        - "Tell your crew medic."
        - "Log your pain score now, and again whenever it changes."
        - "Send the case to Earth."
      red:
        - "Tell your crew medic now."
        - "Log your pain score now, and again whenever it changes."
        - "Send the case to Earth."
    background:
      - text: "NASA lists kidney stones as a spaceflight risk: “Exposure to microgravity induces bone atrophy/bone loss which increases circulating calcium”."
        source: "NASA, Risk of Renal Stone Formation"
        link: "https://www.nasa.gov/directorates/esdmd/hhp/risk-of-renal-stone-formation/"
      - text: "NASA's guidance on prevention is fluid and exercise: crew should be “encouraged to drink an adequate amount”, and exercise lowers “the amount of stone forming calcium in urine”. For the crew medic, NASA notes that “ultrasound and limited lab work can detect and help enable stone risk management”."
        source: "NASA OCHMO Medical Technical Brief MTB-003, Urinary Health, Rev A"
        link: "https://www.nasa.gov/wp-content/uploads/2025/01/ochmo-mtb-003-urinary-health.pdf"
    source: "Placeholder rule, awaiting clinician review. The symptom pattern follows public guidance (healthdirect Australia, Kidney stones; NIDDK, Kidney stones: symptoms and causes). The risk is NASA's: Risk of Renal Stone Formation."
    confidence: Low
    signed_off_by: placeholder

steps:
  green:
    - "Log the reading."
    - "Check in again at your next scheduled time."
  amber:
    - "Repeat the reading to confirm."
    - "Tell your crew medic."
    - "Send the case to Earth."
  red:
    - "Tell your crew medic now."
    - "Repeat the reading to confirm."
    - "Send the case to Earth."
