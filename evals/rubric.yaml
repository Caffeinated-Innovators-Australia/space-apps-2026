# Space Apps 2026 judging rubric: used by the judge-evals skill (run_evals.py)
# v1.1 (14 Nov 2026): audited against the live official guides. Official wording is now separated from team advice; score caps that the official guide does not contain are removed.
# v1.0 (14 Nov 2026): criteria, scale, limits and consequences updated from the official 2026 Judging & Awards Guide
# and Project Submission Guide (both dated 12 Nov 2026). Wording below is paraphrased from those guides.
meta:
  version: "1.1"
  challenge: "Create Health Monitoring Software for Astronauts on Space Missions (NASA Space Apps 2026)"
  judge_context_files: [evals/WINNING_TRAITS.md, evals/COMPETITOR_ARCHETYPES.md, evals/PRIOR_ART.md, evals/HUMAN_FACTORS.md, docs/CHALLENGE.md, docs/RULES.md]
  year: 2026
  criteria_source: "Official 2026 Judging & Awards Guide and Project Submission Guide, read on the live site on 14 Nov 2026: five criteria, each scored 1-5, at every level of judging. No weights are published."
  target_score: 80
  # Weight profiles: the 2026 guide scores all five criteria 1-5 at every level (local, global, executive)
  # and publishes no weights, so local and global are both equal.
  weight_profiles:
    local:  {impact: 20, creativity: 20, validity: 20, relevance: 20, presentation: 20}
    global: {impact: 20, creativity: 20, validity: 20, relevance: 20, presentation: 20}          # % weighted score we aim to hold from h24 onwards
  scale: "1-5 per criterion, as in the official guide. The official guide describes only what a 5 looks like; the 1-4 anchors are our gradations of that descriptor."

auto_config:
  kickoff_utc: "2026-11-13T22:00:00Z"   # Sat 14 Nov 2026, 9:00 am AEDT (submission opens)
  pre_kickoff_allowed_paths_regex: "^(\\.claude/|evals/|CLAUDE\\.md|DRY_RUN|README_BENCH|LICEN[CS]E|\\.gitignore)"
  stage: draft
  australian_english: true
  us_spelling_tolerance: 3
  submission:
    max_slides: 7           # 2026 guide: includes title and intro slides
    max_video_seconds: 30   # 2026 guide: 30 seconds or less
    max_voiceover_words: 80 # ~2.4 words/s; ~65 is the sweet spot (research/pitch_video_playbook.md)
  # From research/data_licence_audit.md (2 Nov): RED = non-commercial / no redistribution / unlicensed under 2026 terms
  red_datasets: [EchoNet-Dynamic, EchoNet, COVIDx-US, COVIDx, NLSP, LSDA, "Standard Measures crew data", MIMIC-IV, MIMIC]

judge_personas:
  - id: nasa_sme
    name: "NASA subject-matter expert (space medicine / human research)"
    brief: "You know NASA-STD-3001, the HRP risks and how crew health is really monitored. You punish clinical hand-waving, invented thresholds and misuse of data, and reward honest uncertainty."
    agent: judge-simulator
  - id: technologist
    name: "Industry technologist judge"
    brief: "You build software products. You check whether the demo actually works, whether the architecture is sensible for the problem, and whether data is used rather than just mentioned."
    agent: judge-simulator
  - id: storyteller
    name: "Local event judge (community, education, comms)"
    brief: "You have about 3 minutes per project. You judge clarity, the hook, whether a non-expert understands the problem and the solution, and the Earth benefit."
    agent: judge-simulator
  - id: sceptic
    name: "Sceptical reviewer"
    brief: "You look for overclaiming, rule breaches, unlabelled synthetic data, AI-generated filler and anything that would embarrass the team in front of NASA."
    agent: validity-sceptic

gates:
  - id: G1
    name: "Uses NASA / space-agency data or resources, cited"
    auto: [A2_agency_data, A3_data_dictionary]
    consequence: "2026: at least one NASA data source or resource is required for Global Award eligibility; Relevance rewards NASA data as a core component"
  - id: G2
    name: "Synthetic data labelled everywhere"
    auto: [A4_synthetic_labelled]
    consequence: "Validity collapse if judges think synthetic data is real"
  - id: G3
    name: "No pre-kick-off project work"
    auto: [A6_no_prekickoff_work]
    consequence: "Disqualification"
  - id: G4
    name: "No secrets committed"
    auto: [A7_no_secrets]
    consequence: "Security incident; repo must be public"
  - id: G5
    name: "Submission within format limits"
    auto: [A14_slide_limit, A15_video_limit]
    consequence: "2026: a demo over 30 s or 7 slides is not eligible for Global Judging"
  - id: G8
    name: "Submitted to the official challenge (not 'Create Your Own'); public, sign-in-free links; English"
    auto: []
    judge_items: [W1, W8, W9]
    consequence: "Not eligible for global judging (judged by the winning_traits checklist W1, W8, W9)"
  - id: G7
    name: "Open-source licence + all third-party sources cited"
    auto: [A17_licence_file, A21_no_red_datasets]
    consequence: "2026 terms: work must be openly licensed; uncited sources can forfeit an award"
  - id: G6
    name: "AI-use disclosed"
    auto: [A5_ai_disclosure]
    consequence: "2026: SI (AI) use must be described; AI may not generate the idea; AI images/video need a visible watermark; AI audio, code and data acknowledged in text and metadata; no NASA branding in AI content"
  - id: G9
    name: "Team eligibility: every member registered, on the Members tab, at the same Local Event, not waitlisted; six members or fewer; Submit for Judging pressed before the deadline"
    auto: []
    judge_items: [W10]
    consequence: "2026 guide: not eligible for Global Judging. A person on the team must check this; it cannot be seen from the repository"
  - id: G10
    name: "No image, video, audio or other likeness of anyone under 18"
    auto: []
    judge_items: [W25]
    consequence: "2026 Submission Guide and Terms: rules breach"
  # Not modelled, needs a person: both tick-boxes on the submission form (terms; original work and all external
  # resources listed in References), and NASA's review for prohibited bilateral activity with China or a
  # Chinese-owned entity, which NASA decides at its sole discretion before Global Judging.

criteria:
  # v1.1 (14 Nov 2026 audit): each criterion now separates what the official 2026 Judging & Awards Guide says
  # (official_wording, look_for) from our own advice (team_guidance, concerns). The official guide defines each
  # criterion and describes only a score of 5; it gives no anchors for 1-4, no weights and no score caps.
  # The anchors below are our gradations of the official score-5 descriptor.
  - id: impact
    name: "Impact"
    weight: 20
    source: "2026 Judging & Awards Guide, read 14 Nov 2026"
    official_wording: 'Paraphrase of the official text. Criterion: the project addresses a minor or a major problem, which shapes the quality and quantity of its effect; how far it inspires or helps others ranges from a select few to a broad audience. Score of 5 (Outstanding Impact): exceptional impact, a significant problem with proposed solutions; reach is extensive, inspiring, benefits a large audience or could change the world; quality and effectiveness far exceed expectations.'
    personas: [nasa_sme, storyteller]
    look_for:
      - "How significant the problem is (minor to major)"
      - "How far the effect reaches: who is helped or inspired, a select few or a broad audience"
      - "The quality and effectiveness of the proposed solution"
    team_guidance:
      - "A named primary user with a specific pain point helps a judge see the problem"
      - "Sourced figures for the size of the problem, and a credible Earth benefit, widen the reach a judge can credit"
    anchors:
      1: "A minor problem or none evident; helps very few; little sign the solution would be effective"
      2: "A real but narrow problem; limited reach; effectiveness plausible but not shown"
      3: "A clear problem of moderate significance; helps a defined group; effectiveness reasonably shown"
      4: "A significant problem; broad or inspiring reach; a solution that looks effective"
      5: "A significant problem; extensive, inspiring reach that benefits a large audience or could change the world; quality far exceeds expectations"
    concerns: ["Impact claims with no support", "Solves a problem the challenge did not ask about"]
    evidence: ["pitch/PROJECT_PAGE.md (the project page text judges read)", "the demo (pitch/ video or slides)", "the final project link: the running app and README"]
  - id: creativity
    name: "Creativity"
    weight: 20
    source: "2026 Judging & Awards Guide, read 14 Nov 2026"
    official_wording: 'Paraphrase of the official text. Criterion: originality and innovation; a novel concept not attempted before, or a meaningful improvement on existing ideas; a fresh perspective or inventive execution. Score of 5 (Highly Creative and Innovative): remarkable creativity, a groundbreaking approach never attempted before; challenges conventional methods; an original, inventive solution that stands out in its field.'
    personas: [nasa_sme, technologist, storyteller]
    look_for:
      - "A novel concept, or a meaningful improvement on existing ideas"
      - "A fresh perspective or inventive execution"
      - "Whether it challenges conventional methods and stands out in its field"
    team_guidance:
      - "evals/COMPETITOR_ARCHETYPES.md describes what the 2026 field is building. Use it as context for 'has this been seen before'. Its ceilings are our estimates, not official rules, and are not caps"
      - "A meaningful improvement on existing ideas counts as creative under the official wording, not only something never attempted"
    anchors:
      1: "A conventional approach with no evident originality"
      2: "A familiar approach with a small twist"
      3: "A meaningful improvement on existing ideas, or one clearly original element"
      4: "A fresh perspective and inventive execution that stands out among similar projects"
      5: "A groundbreaking approach not attempted before; challenges conventional methods; a true innovation"
    concerns: ["Indistinguishable from a generic vitals dashboard", "An LLM chatbot as the whole idea"]
    evidence: ["pitch/PROJECT_PAGE.md", "the demo", "the final project link: the running app and README", "evals/COMPETITOR_ARCHETYPES.md (context only)"]
  - id: validity
    name: "Validity"
    weight: 20
    source: "2026 Judging & Awards Guide, read 14 Nov 2026"
    official_wording: 'Paraphrase of the official text. Criterion: grounded in scientific principles; technically, functionally or logically feasible; designed to achieve its intended purpose with potential to function in real-world applications; completeness varies from fully developed to needing significant refinement; usability and user-friendliness affect practicality and accessibility. Score of 5 (Highly Valid and Feasible): scientifically sound and technically feasible, aligned with established principles; fully developed and ready for real-world implementation; highly usable and user-friendly.'
    personas: [nasa_sme, sceptic, technologist]
    look_for:
      - "Grounded in scientific principles; aligned with established knowledge"
      - "Technically, functionally or logically feasible; does it achieve its intended purpose"
      - "How complete it is: fully developed, or still needing significant refinement"
      - "Usability and user-friendliness: practical and accessible for the intended user"
      - "Potential to function in a real-world application"
    team_guidance:
      - "For a health tool, sourced thresholds, stated limitations and honest labelling of synthetic data are how scientific grounding shows"
      - "Assessment rather than diagnosis; rules decide and AI only explains"
      - "evals/PRIOR_ART.md and evals/HUMAN_FACTORS.md give domain context a specialist judge would bring"
    anchors:
      1: "Not scientifically grounded, or does not work"
      2: "Partly feasible; significant gaps in science, function or usability"
      3: "Sound in principle and working for its main purpose; needs significant refinement before real use"
      4: "Scientifically sound and feasible; largely complete; usable and user-friendly"
      5: "Scientifically sound and technically feasible; fully developed and ready for real-world implementation; highly usable and user-friendly"
    concerns: ["Claims 'first', 'validated' or NASA integration (see PRIOR_ART.md)", "Clinical values with no source", "Synthetic data presented as real", "Accuracy claimed from synthetic data", "Diagnosis stated as fact"]
    evidence: ["pitch/PROJECT_PAGE.md", "the demo", "the final project link: the running app and README", "repository documents a judge might open: docs/EVIDENCE.md, rules/ files"]
  - id: relevance
    name: "Relevance"
    weight: 20
    source: "2026 Judging & Awards Guide, read 14 Nov 2026"
    official_wording: 'Paraphrase of the official text. Criterion: fully and directly addresses the challenge it was submitted to, aligned with its objectives; meaningfully integrates NASA data as a core component rather than a superficial addition; depth of engagement with the data adds credibility and effectiveness. Score of 5 (Highly Relevant and Strong NASA Data Integration): thoroughly engages with the challenge, deeply connected to its goals; NASA data is integral to the project''s success and drives the innovation; the use of data is well executed.'
    personas: [nasa_sme, sceptic]
    look_for:
      - "Fully and directly addresses the challenge and its stated objectives"
      - "NASA data integrated as a core component, not a superficial addition"
      - "Depth of engagement with the data; the use of data is well executed"
    team_guidance:
      - "The challenge's objective is a visual tool that gathers health indicators and lets astronauts evaluate and act on their health. The 'questions worth considering' and 'potential considerations' in the statement are optional; answering them strengthens the case but is not required"
      - "The NASA Data field on the project page is where a judge checks which data was used and how"
    anchors:
      1: "Does not address the challenge"
      2: "Touches the challenge but misses its objectives, or NASA data is absent or only listed"
      3: "Addresses the main objective; NASA data is used but is not central"
      4: "Directly addresses the challenge objectives; NASA data is a core component"
      5: "Thoroughly engages with the challenge; NASA data is integral, well executed and drives the solution"
    concerns: ["A key verb of the statement (gather, evaluate, act) is not delivered", "NASA data only listed in references, not used in the product"]
    evidence: ["pitch/PROJECT_PAGE.md, especially the NASA Data field", "the demo", "the final project link: the running app", "docs/CHALLENGE.md"]
  - id: presentation
    name: "Presentation"
    weight: 20
    source: "2026 Judging & Awards Guide and 2026 Project Submission Guide, read 14 Nov 2026"
    official_wording: 'Paraphrase of the official text. Criterion: the team communicated the project effectively, conveying the challenge, the proposed solution and its significance; storytelling engaging and well structured; clarity, organisation and delivery make the ideas compelling. Judges evaluate the demo and the full project to compute this score. Score of 5 (Exceptional Communication and Storytelling): a well-structured, compelling presentation that clearly articulates the challenge, the solution and its importance; engaging storytelling; polished, structured and highly effective delivery. The Submission Guide adds: the demo counts, but most of the evaluation rests on the project submission page.'
    personas: [storyteller, technologist]
    look_for:
      - "Clearly conveys the challenge, the proposed solution and its significance"
      - "Engaging, well-structured storytelling; clear, organised, polished delivery"
      - "Judged on the demo and the full project together; most weight on the project page"
      - "A reader with no context or technical background can follow it (Submission Guide)"
    team_guidance:
      - "Official suggested video outline (Submission Guide): 0:00 introduce yourself, your name and team name; 0:02 the challenge and what inspired the choice; 0:05 project title and tagline; 0:10 how it works, with images or a prototype, a user's experience, and how NASA and partner data made it possible; 0:20 to 0:30 the future, what it could do for people and the world. It is a suggestion, not a scored requirement"
      - "A slide demo should carry the team name, member names and the challenge selected (Submission Guide)"
      - "Our own advice, not official: about 62 to 80 spoken words in 30 seconds; show the working product for most of the runtime; name the data source on screen"
      - "The Use of SI field is collected for data purposes and is not shown to judges; judges do see watermarks, descriptive text and metadata in the project"
    anchors:
      1: "Confusing or incomplete; the challenge, solution or significance cannot be made out"
      2: "Understandable with effort; weak structure; key parts missing"
      3: "Clear and complete; conveys the challenge, solution and significance"
      4: "Clear, engaging and well structured; a reader with no context follows it easily"
      5: "Compelling, polished storytelling; the significance and potential impact are fully grasped"
    concerns: ["No demo, or a demo over 30 seconds or 7 slides: this is an eligibility failure for Global Judging, handled by gate G5, not a score cap", "NASA logo or branding used", "AI-generated image or video without a visible watermark", "Any image, video, audio or likeness of a person under 18", "Third-party material that is not openly licensed or cited"]
    evidence: ["pitch/PROJECT_PAGE.md", "the demo in pitch/", "the final project link: the running app and README"]

  - id: winning_traits
    name: "Winning-traits checklist (diagnostic, not an official criterion)"
    weight: 0
    source: "evals/WINNING_TRAITS.md (2016–2025 winners; official 2026 guides)"
    official_wording: 'Not an official criterion: a pass/fail checklist of what past Global Winners and Nominees did.'
    personas: [sceptic]
    look_for:
      - "Go through every item W1–W25 in evals/WINNING_TRAITS.md and mark it pass, fail or n/a with evidence"
      - "In `gaps`, list every failed item as 'Wn: why'"
    anchors:
      1: "Under 40% of applicable items pass"
      2: "40–59% pass"
      3: "60–74% pass"
      4: "75–89% pass, and W1–W4, W8 and W11–W14 all pass"
      5: "90% or more pass, including every rules item (W1, W2, W4, W8–W12, W25)"
    concerns: ["W1 fails (wrong track), which makes it ineligible for global judging", "W2 fails (no NASA data or resource), so it is not eligible for a Global Award", "W4 fails (demo over the limit), which makes it ineligible for global judging"]
    evidence: ["evals/WINNING_TRAITS.md", "README / project page text", "pitch/", "demo", "docs/"]
